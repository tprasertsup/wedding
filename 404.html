<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — Nine &amp; Tom</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f7f3eb">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gloock&family=EB+Garamond:ital,wght@0,400;1,400&family=Archivo:wght@400;500;600&family=Nothing+You+Could+Do&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/base.css">
  <style>
    main { text-align: center; }
    .card { max-width: 480px; }
    .mark {
      font-family: var(--script);
      font-size: 2.4rem;
      line-height: 1;
      margin-bottom: 1.2rem;
    }
    .mark .amp { color: var(--terracotta); }
    .code {
      font-family: var(--label);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--terracotta);
    }
    h1 { font-size: clamp(1.6rem, 5vw, 2.1rem); margin: 0.3rem 0 0.5rem; }
    p { color: var(--ink-2); }
    .card::before { display: none; }
  </style>
</head>
<body>

<main>
  <div class="card">
    <div class="mark">N <span class="amp">&amp;</span> T</div>
    <p class="code">404</p>
    <h1>This page has wandered off</h1>
    <p>The link may be mistyped, or the page may have moved.</p>
    <a href="/" class="btn-another" style="margin-top:1.6rem">Back to the invitation</a>
  </div>
</main>

</body>
</html>
