<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Two rings, interlocked — in the invitation's ink and terracotta -->
  <circle cx="12" cy="16" r="7" fill="none" stroke="#232b25" stroke-width="3"/>
  <circle cx="20" cy="16" r="7" fill="none" stroke="#c2674a" stroke-width="3"/>
  <!-- Cover the overlap seam so the rings read as interlocked -->
  <path d="M16 10 Q14 16 16 22" fill="none" stroke="#f7f3eb" stroke-width="3.5"/>
  <path d="M16 10 Q18 16 16 22" fill="none" stroke="#c2674a" stroke-width="3"/>
</svg>
